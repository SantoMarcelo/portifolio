    "/api/v1/orders": {
      "post": {
        "tags": [
          "Checkout e Pedidos"
        ],
        "summary": "Confirma o pedido a partir do carrinho (pagamento simulado)",
        "description": "Cartão final 0000 → aprovado; 1111 → recusado (422, pedido PAYMENT_FAILED); 2222 → indisponível (503, pedido PAYMENT_FAILED); demais finais → aprovado. PIX/boleto → aprovados. Aprovado: baixa de estoque atômica e carrinho limpo. Nos erros de pagamento, `error.details[0].orderId` traz o pedido PAYMENT_FAILED criado.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "address": {
                    "type": "object",
                    "properties": {
                      "street": {
                        "type": "string",
                        "minLength": 2,
                        "maxLength": 150
                      },
                      "number": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 10
                      },
                      "complement": {
                        "type": "string",
                        "maxLength": 100
                      },
                      "district": {
                        "type": "string",
                        "minLength": 2,
                        "maxLength": 100
                      },
                      "city": {
                        "type": "string",
                        "minLength": 2,
                        "maxLength": 100
                      },
                      "state": {
                        "type": "string",
                        "minLength": 2,
                        "maxLength": 2
                      },
                      "zip": {
                        "type": "string",
                        "pattern": "^\\d{5}-?\\d{3}$"
                      }
                    },
                    "required": [
                      "street",
                      "number",
                      "district",
                      "city",
                      "state",
                      "zip"
                    ]
                  },
                  "payment": {
                    "oneOf": [
                      {
                        "type": "object",
                        "properties": {
                          "method": {
                            "type": "string",
                            "enum": [
                              "CREDIT_CARD"
                            ]
                          },
                          "cardNumber": {
                            "type": "string"
                          },
                          "cardHolder": {
                            "type": "string",
                            "minLength": 2,
                            "maxLength": 100
                          }
                        },
                        "required": [
                          "method",
                          "cardNumber"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "method": {
                            "type": "string",
                            "enum": [
                              "PIX"
                            ]
                          }
                        },
                        "required": [
                          "method"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "method": {
                            "type": "string",
                            "enum": [
                              "BOLETO"
                            ]
                          }
                        },
                        "required": [
                          "method"
                        ]
                      }
                    ]
                  },
                  "couponCode": {
                    "type": "string",
                    "maxLength": 30
                  }
                },
                "required": [
                  "address",
                  "payment"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Pedido PAID",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Order"
                }
              }
            }
          },
          "400": {
            "description": "VALIDATION_ERROR",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "UNAUTHORIZED | TOKEN_EXPIRED | INVALID_TOKEN",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "FORBIDDEN (apenas CUSTOMER)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "OUT_OF_STOCK (nada é alterado; details lista os itens)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "422": {
            "description": "CART_EMPTY | INVALID_COUPON | PAYMENT_DECLINED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "503": {
            "description": "PAYMENT_UNAVAILABLE",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      },
